# Generated by .agents/scripts/sync_agent_configuration.py
personality = "friendly"

[mcp_servers."nx"]
command = "npx"
args = [ "nx", "mcp" ]
cwd = "."
enabled = true

[mcp_servers."filesystem"]
command = "npx"
args = [ "-y", "@modelcontextprotocol/server-filesystem", "." ]
cwd = "."
enabled = true

[mcp_servers."playwright"]
command = "npx"
args = [ "@playwright/mcp@latest" ]
cwd = "."
enabled = true

[mcp_servers."angular"]
command = "npx"
args = [ "-y", "@angular/cli", "mcp" ]
cwd = "."
enabled = true

[mcp_servers."mosaik"]
url = "https://beta.api.mosaik.breadstone.de/api/mcp"
enabled = true

[features]
multi_agent = true

[agents]
max_concurrent_threads_per_session = 4
