name: Repository Quality

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      documentation_only: ${{ steps.scope.outputs.documentation_only }}
      documentation_changed: ${{ steps.scope.outputs.documentation_changed }}
    steps:
      - name: Checkout the complete event history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Classify the event diff
        id: scope
        run: node tools/ClassifyCiChanges.mjs

  documentation:
    name: Documentation links and structure
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        if: needs.changes.outputs.documentation_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        if: needs.changes.outputs.documentation_changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Validate operational documentation
        if: needs.changes.outputs.documentation_changed == 'true'
        run: node .agents/skills/symphony-docs/scripts/validate-docs.mjs docs

  quality:
    name: Agents, Format, Lint, Typecheck, Test and Build (${{ matrix.os }})
    needs: changes
    # Keep every required OS context, with lightweight Linux stubs for prose-only changes.
    runs-on: ${{ needs.changes.outputs.documentation_only == 'true' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.documentation_only == 'true'
        run: echo 'Documentation-only change; dependency installation and source verification are skipped.'

      - name: Checkout
        if: needs.changes.outputs.documentation_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        if: needs.changes.outputs.documentation_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Enable Corepack
        if: needs.changes.outputs.documentation_only != 'true'
        run: corepack enable

      - name: Enable Yarn
        if: needs.changes.outputs.documentation_only != 'true'
        run: corepack prepare yarn@4.10.3 --activate

      - name: Install dependencies
        if: needs.changes.outputs.documentation_only != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: yarn install --immutable

      - name: Verify repository
        if: needs.changes.outputs.documentation_only != 'true'
        env:
          VITEST_MAX_WORKERS: ${{ runner.os == 'Windows' && '1' || '' }}
        run: yarn verify

  electron-e2e:
    name: Electron E2E
    needs: [changes, quality]
    if: needs.changes.outputs.documentation_only != 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Enable Yarn
        run: corepack prepare yarn@4.10.3 --activate

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Install Chromium for the mobile companion journey
        run: yarn playwright install chromium

      - name: Run Electron tests
        run: yarn e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            apps/renderer-e2e/output/playwright/**
            output/playwright/**
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package smoke test
    needs: [changes, quality]
    if: needs.changes.outputs.documentation_only != 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      SYMPHONY_UPDATE_BASE_URL: https://pixel-brewery.github.io/symphony
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Enable Yarn
        run: corepack prepare yarn@4.10.3 --activate

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: yarn install --immutable

      - name: Package
        run: yarn forge:package

      - name: Create and verify macOS installer
        run: |
          yarn electron-forge make --from-package --arch=arm64
          version="$(node -p 'require("./package.json").version')"
          hdiutil verify "out/make/Symphony-darwin-arm64-${version}.dmg"

      - name: Verify automatic update in the packaged application
        env:
          SYMPHONY_E2E_PACKAGED_UPDATE: '1'
          SYMPHONY_E2E_WINDOW_MODE: hidden
        run: |
          export SYMPHONY_E2E_PACKAGED_EXECUTABLE="$PWD/out/Symphony-darwin-arm64/Symphony.app/Contents/MacOS/Symphony"
          yarn exec playwright test --config apps/renderer-e2e/playwright.config.ts packaged-update.spec.ts

  quality-gate:
    name: Quality Gate
    if: ${{ always() }}
    needs: [changes, documentation, quality, electron-e2e, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the verification path selected by the successful classification
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          DOCUMENTATION_ONLY: ${{ needs.changes.outputs.documentation_only }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.electron-e2e.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$DOCUMENTATION_RESULT" = success
          test "$QUALITY_RESULT" = success
          case "$DOCUMENTATION_ONLY" in
            true) expected=skipped ;;
            false) expected=success ;;
            *) echo 'Missing or invalid change classification.' >&2; exit 1 ;;
          esac
          test "$E2E_RESULT" = "$expected"
          test "$PACKAGE_RESULT" = "$expected"
