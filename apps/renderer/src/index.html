<!doctype html>
<html lang="en" theme="soho" theme-mode="light">
  <head>
    <meta charset="utf-8" />
    <title>Symphony</title>
    <base href="./" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" type="image/svg+xml" href="icons/symphony.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/png/symphony-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/png/symphony-180.png" />
    <style>
      .startup-splash-fallback {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .startup-splash-fallback img {
        width: 128px;
        height: 128px;
      }
    </style>
  </head>
  <body>
    <symphony-shell>
      <div class="startup-splash-fallback" role="status" aria-label="Starting Symphony">
        <img src="icons/symphony-mark.svg" alt="Symphony" />
      </div>
    </symphony-shell>
  </body>
</html>
