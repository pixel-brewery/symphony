@if (presenter.workspace(); as item) {
<div class="flex min-w-0 flex-col gap-3" [attr.test-id]="'workspace-card-' + item.id">
  @if (presenter.hasBoards()) {
  <mosaik-view-slot-outlet
    class="contents"
    [slot]="slots.WorkspaceServicesBoards"
    [symphonySettingsSelection]="{workspaceId: item.id, sectionId: 'services'}"
  />
  } @if (presenter.hasAccounts() && presenter.accounts().length) {
  <symphony-settings-group
    [heading]="'Connected services'"
    [description]="'Ticket sources, source-code accounts, and the AI accounts every agent in this workspace can run on.'"
    [attr.test-id]="'configured-accounts-' + item.id"
  >
    @for (account of presenter.accounts(); track account.id) {
    <mosaik-view-slot-outlet
      class="block min-w-0"
      [slot]="slots.WorkspaceServicesAccount"
      [symphonySettingsSelection]="{workspaceId: item.id, sectionId: 'services', connectionId: account.id, connectionKind: account.kind}"
    />
    }
  </symphony-settings-group>
  }
  <mosaik-view-slot-outlet
    class="contents"
    [slot]="slots.WorkspaceServicesFeedback"
    [symphonySettingsSelection]="{workspaceId: item.id, sectionId: 'services'}"
  />
  @if (presenter.hasAvailable()) {
  <symphony-settings-group
    [heading]="'Add a service'"
    [description]="'Connect an AI account, another ticket source, or a source-code account.'"
    [framed]="false"
  >
    <!-- The outlet is the framed row list itself, so each contributing feature's rows share one frame. -->
    <mosaik-view-slot-outlet
      part="settings-group-rows"
      class="flex min-w-0 flex-col"
      [attr.test-id]="'available-connections-' + item.id"
      [slot]="slots.WorkspaceServicesAvailableConnections"
      [symphonySettingsSelection]="{workspaceId: item.id, sectionId: 'services'}"
    />
  </symphony-settings-group>
  }
</div>
}
