<ng-container *mosaikTranslate="let tr">
  @if(presenter.workspace(); as item){ @for (runtime of presenter.aiRuntimes; track runtime) {
  <symphony-settings-row
    [attr.test-id]="'ai-runtime-account-' + runtime + '-' + item.id"
    [label]="presenter.aiRuntimeLabel()(runtime)"
    [description]="presenter.aiRuntimeSummary()(runtime)"
  >
    <mosaik-avatar
      slot="leading"
      [size]="'small'"
      [appearance]="'outline'"
      [icon]="runtime | connectionIcon"
    />
    <mosaik-button
      [attr.test-id]="'add-ai-runtime-account-' + runtime + '-' + item.id"
      [label]="tr('loc.symphony.connect.1a2303')"
      [icon]="'add'"
      [iconSize]="'small'"
      [appearance]="'outline'"
      (click)="presenter.openAiAccountCommand.execute([item.id, runtime])"
    />
  </symphony-settings-row>
  } }
</ng-container>
