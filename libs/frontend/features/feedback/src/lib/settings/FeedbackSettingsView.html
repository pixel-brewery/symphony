<ng-container *mosaikTranslate="let tr">
  @if (presenter.workspace(); as item) {
  <symphony-settings-group
    [heading]="tr('loc.symphony.feedback.intake.bde58a')"
    [description]="tr('loc.symphony.turn.requested.teams.feedback.from.microsoft.teams.i.b8a9a2')"
    [attr.test-id]="'feedback-intake-settings-' + item.id"
  >
    @for (source of presenter.sources(); track source.id) { @let targetRepository =
    presenter.repository()(source.targetRepositoryBindingId);
    <symphony-settings-row
      [attr.test-id]="'configured-feedback-intake-' + source.id"
      [label]="source.displayName"
      [description]="tr('loc.symphony.microsoft.teams.afa867', [(source.enabled ? tr('loc.symphony.enabled.92c1cd') : tr('loc.symphony.disabled.75081b')), (targetRepository ? targetRepository.owner + '/' + targetRepository.name : tr('loc.symphony.target.unavailable.06c6e8'))])"
    >
      <mosaik-avatar slot="leading" [size]="'small'" [appearance]="'soft'" [icon]="'flow'" />
      <mosaik-button
        [attr.test-id]="'edit-feedback-intake-' + source.id"
        [label]="tr('loc.symphony.edit.464c4f')"
        [icon]="'edit'"
        [iconSize]="'small'"
        [appearance]="'plain'"
        (click)="presenter.openTeamsFeedbackCommand.execute([item.id, source.id])"
      />
    </symphony-settings-row>
    }
    <symphony-settings-row
      [attr.test-id]="'microsoft-teams-feedback-' + item.id"
      [label]="tr('loc.symphony.microsoft.teams.a7b52b')"
      [description]="tr('loc.symphony.read.one.teams.channel.for.symphony.feedback.request.4b30ac')"
    >
      <mosaik-avatar slot="leading" [size]="'small'" [appearance]="'outline'" [icon]="'flow'" />
      <mosaik-button
        [attr.test-id]="'add-teams-feedback-intake-' + item.id"
        [label]="tr('loc.symphony.connect.1a2303')"
        [icon]="'add'"
        [iconSize]="'small'"
        [appearance]="'outline'"
        (click)="presenter.openTeamsFeedbackCommand.execute([item.id])"
      />
    </symphony-settings-row>
  </symphony-settings-group>
  }
</ng-container>
