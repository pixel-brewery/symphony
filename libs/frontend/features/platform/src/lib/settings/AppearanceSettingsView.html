<symphony-settings-group
  test-id="theme-settings-card"
  [heading]="'Color theme'"
  [description]="'Select a fixed appearance or follow the current macOS preference.'"
>
  <symphony-settings-row
    test-id="appearance-theme-settings-group"
    [label]="'Theme'"
    [description]="'Choose System to switch between light and dark automatically when macOS changes.'"
  >
    <symphony-theme-segment />
  </symphony-settings-row>
</symphony-settings-group>
<mosaik-view-slot-outlet class="contents" [slot]="appearanceSlot" />
