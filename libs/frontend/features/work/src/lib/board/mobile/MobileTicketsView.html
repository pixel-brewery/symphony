<ng-container *mosaikTranslate="let tr">
  <mosaik-page class="block min-h-full min-w-0" test-id="mobile-tickets-view">
    <mosaik-page-header
      [inset]="'all'"
      [text]="tr('loc.symphony.tickets.3d1313')"
      [subText]="tr('loc.symphony.shown.c67ec9', [presenter.tickets().length])"
    >
      <mosaik-button
        slot="suffix"
        [label]="tr('loc.symphony.new.18fdd5')"
        [variant]="'primary'"
        [routerLink]="['/tickets/new']"
        test-id="mobile-tickets-create"
      />
    </mosaik-page-header>
    <mosaik-page-pre-content [inset]="'horizontal'">
      <mosaik-searchbox
        class="flex w-full min-w-0"
        [value]="presenter.query()"
        [placeholder]="tr('loc.symphony.title.or.ticket.id.1ea65f')"
        [isClearable]="true"
        [mode]="'delay'"
        [delay]="150"
        (searched)="presenter.updateQueryCommand.execute($event)"
        (cleared)="presenter.clearQueryCommand.execute()"
        test-id="mobile-ticket-search"
      />
    </mosaik-page-pre-content>
    <mosaik-page-content [inset]="'all'">
      <div class="grid min-w-0 gap-2">
        @for (ticket of presenter.tickets(); track ticket.id) {
        <symphony-mobile-ticket-card [ticket]="ticket" />
        } @empty {
        <p>{{ tr('loc.symphony.no.matching.tickets.4e0073') }}</p>
        }
      </div>
    </mosaik-page-content>
  </mosaik-page>
</ng-container>
