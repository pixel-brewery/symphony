<ng-container *mosaikTranslate="let tr">
  <ng-template mosaikDialogHeader>
    <mosaik-dialog-header
      [text]="tr('loc.symphony.group.selected.tickets.7ccaa9')"
      [subText]="tr('loc.symphony.choose.whether.symphony.should.analyze.the.relations.d6f856')"
    />
  </ng-template>

  <ng-template mosaikDialogContent>
    <div class="flex min-w-0 flex-col gap-4 py-1">
      <mosaik-text
        [text]="tr('loc.symphony.direct.grouping.is.intended.for.an.explicit.operator.61d23a')"
        [wrap]="true"
      />
      <mosaik-radio-group
        [attr.test-id]="'delivery-group-mode'"
        [name]="'delivery-group-mode'"
        [orientation]="'vertical'"
        [value]="presenter.mode()"
        (radioChanged)="presenter.changeMode($event)"
      >
        <mosaik-radio
          [attr.test-id]="'delivery-group-mode-direct'"
          [value]="'direct'"
          [label]="tr('loc.symphony.copy.directly.without.ai.analysis.76422a')"
        />
        <mosaik-radio
          [attr.test-id]="'delivery-group-mode-analyzer'"
          [value]="'analyzer'"
          [label]="tr('loc.symphony.analyze.relationship.with.ai.first.8af0a9')"
        />
      </mosaik-radio-group>
    </div>
  </ng-template>

  <ng-template mosaikDialogFooter>
    <div class="flex items-center justify-end gap-2">
      <mosaik-button
        [attr.test-id]="'delivery-group-mode-cancel'"
        [label]="tr('loc.symphony.cancel.19766e')"
        [appearance]="'plain'"
        (click)="presenter.cancel()"
      />
      <mosaik-button
        [attr.test-id]="'delivery-group-mode-continue'"
        [label]="tr('loc.symphony.continue.31fbef')"
        [appearance]="'solid'"
        [variant]="'primary'"
        (click)="presenter.continue()"
      />
    </div>
  </ng-template>
</ng-container>
