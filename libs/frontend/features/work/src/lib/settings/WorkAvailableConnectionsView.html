@if(presenter.workspace(); as item){
<symphony-settings-row
  [attr.test-id]="'azure-account-' + item.id"
  [label]="'Azure DevOps'"
  [description]="'Add a work-item account'"
>
  <mosaik-avatar slot="leading" [size]="'small'" [appearance]="'outline'" [icon]="'azureDevOps'" />
  <mosaik-button
    [attr.test-id]="'add-azure-source-' + item.id"
    [label]="'Connect'"
    [icon]="'add'"
    [iconSize]="'small'"
    [appearance]="'outline'"
    (click)="presenter.openAzureCommand.execute([item.id])"
  />
</symphony-settings-row>
}
