@if(presenter.account(); as account){
<symphony-settings-row
  [attr.test-id]="'configured-account-' + account.id"
  [label]="account.displayName"
  [description]="account.kind === 'azure-devops' ? 'Azure DevOps · ' + account.organization : account.kind === 'github' ? 'GitHub · ' + account.hostname + (account.accountLogin ? ' · @' + account.accountLogin : '') : ''"
>
  <mosaik-avatar
    slot="leading"
    [size]="'small'"
    [appearance]="'soft'"
    [icon]="account.kind | connectionIcon"
  />
  <mosaik-button
    [attr.test-id]="'edit-account-' + account.id"
    [label]="'Edit'"
    [icon]="'edit'"
    [iconSize]="'small'"
    [disabled]="!presenter.canEditAccount()"
    [appearance]="'plain'"
    (click)="presenter.openAccountCommand.execute(account)"
  />
</symphony-settings-row>
}
