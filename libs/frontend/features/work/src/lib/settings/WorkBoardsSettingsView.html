<ng-container *mosaikTranslate="let tr">
  @if(presenter.workspace(); as item){
  <symphony-settings-group
    [heading]="tr('loc.symphony.boards.4fcd39')"
    [description]="tr('loc.symphony.each.board.is.one.github.project.or.azure.devops.que.61524b')"
    [attr.test-id]="'workspace-boards-' + item.id"
  >
    @for (board of presenter.workspaceBoards()(item.id); track board.id) {
    <symphony-settings-row
      [attr.test-id]="'configured-board-' + board.id"
      [label]="board.displayName"
      [description]="presenter.boardSummary()(board)"
    >
      <mosaik-avatar
        slot="leading"
        [size]="'small'"
        [appearance]="'soft'"
        [icon]="board.provider === 'azure-devops' ? 'azureDevOps' : 'github'"
      />
      <mosaik-button
        [attr.test-id]="'edit-board-' + board.id"
        [label]="tr('loc.symphony.edit.464c4f')"
        [icon]="'edit'"
        [iconSize]="'small'"
        [appearance]="'plain'"
        (click)="presenter.openBoardCommand.execute(board)"
      />
    </symphony-settings-row>
    }
    <symphony-settings-row
      [attr.test-id]="'add-github-board-entry-' + item.id"
      [label]="tr('loc.symphony.github.projects.board.4ddeac')"
      [description]="tr('loc.symphony.choose.a.project.owned.by.the.signed.in.account.or.l.f3908e')"
    >
      <mosaik-avatar slot="leading" [size]="'small'" [appearance]="'outline'" [icon]="'github'" />
      <mosaik-button
        [attr.test-id]="'add-github-board-' + item.id"
        [label]="tr('loc.symphony.add.board.bf2bae')"
        [icon]="'add'"
        [iconSize]="'small'"
        [appearance]="'outline'"
        (click)="presenter.openGitHubProjectsCommand.execute([item.id])"
      />
    </symphony-settings-row>
  </symphony-settings-group>
  }
</ng-container>
