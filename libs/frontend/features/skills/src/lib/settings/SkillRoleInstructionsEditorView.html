<ng-container *mosaikTranslate="let tr">
  <ng-template mosaikDialogHeader>
    @let skill = presenter.skill();
    <mosaik-dialog-header
      slot="header"
      [text]="tr('loc.symphony.instructions.01a165', [(skill?.displayName ?? tr('loc.symphony.process.role.1ee7e4'))])"
      [subText]="tr('loc.symphony.process.role.of.the.step.9602fe', [(presenter.step?.label ?? ''), (skill ? tr('loc.symphony.v.4f9895', [skill.version, (skill.mutatesWorkspace ? tr('loc.symphony.changes.files.838b2a') : tr('loc.symphony.reads.only.7846ad'))]) : '')])"
    >
      <mosaik-dismiss slot="suffix" (click)="presenter.closeCommand.execute()" />
    </mosaik-dialog-header>
  </ng-template>
  <ng-template mosaikDialogContent>
    @let skill = presenter.skill();
    <div
      class="flex max-h-[calc(100dvh-240px)] min-h-0 min-w-0 flex-1 flex-col gap-1.5 overflow-y-auto py-0.5"
      [attr.test-id]="'builtin-skill-instructions-sheet-' + presenter.data.role"
    >
      <mosaik-segment
        class="w-full"
        [attr.aria-label]="tr('loc.symphony.instructions.934652')"
        [appearance]="'soft'"
      >
        <mosaik-segment-item
          [attr.test-id]="'builtin-skill-tab-shipped-' + presenter.data.role"
          [label]="tr('loc.symphony.built.in.instructions.7ae4a7')"
          [fit]="'width'"
          [isChecked]="presenter.tab() === 'shipped'"
          (checked)="presenter.tab.set('shipped')"
        />
        <mosaik-segment-item
          [attr.test-id]="'builtin-skill-tab-additional-' + presenter.data.role"
          [label]="tr('loc.symphony.your.additions.7303b7')"
          [fit]="'width'"
          [isChecked]="presenter.tab() === 'additional'"
          (checked)="presenter.tab.set('additional')"
        />
      </mosaik-segment>
      @if (presenter.tab() === 'shipped') {
      <mosaik-textbox
        [attr.test-id]="'builtin-skill-shipped-' + presenter.data.role"
        [label]="tr('loc.symphony.built.in.instructions.7ae4a7')"
        [multiline]="true"
        [multilineRows]="12"
        [readonly]="true"
        [value]="skill?.instructions ?? ''"
      />
      <mosaik-text
        [mosaikTypography]="'caption'"
        [variant]="'neutral'"
        [wrap]="true"
        [text]="tr('loc.symphony.shipped.with.symphony.and.versioned.with.it.read.the.9a99ff')"
      />
      } @else {
      <mosaik-textbox
        [attr.test-id]="'builtin-skill-instructions-' + presenter.data.role"
        [label]="tr('loc.symphony.additional.instructions.08a2b2')"
        [multiline]="true"
        [multilineRows]="8"
        [value]="presenter.additions()"
        (input)="presenter.updateAdditionsCommand.execute($event)"
      />
      <mosaik-text
        [mosaikTypography]="'caption'"
        [variant]="'neutral'"
        [wrap]="true"
        [text]="tr('loc.symphony.appended.below.the.built.in.instructions.they.refine.4dc635')"
      />
      }
    </div>
  </ng-template>
  <ng-template mosaikDialogFooter>
    @let skill = presenter.skill();
    <div class="flex w-full min-w-0 items-center gap-1">
      <mosaik-button
        [attr.test-id]="'builtin-skill-reset-' + presenter.data.role"
        [label]="tr('loc.symphony.reset.daee76')"
        [appearance]="'plain'"
        [disabled]="presenter.busy() || !skill?.additionalInstructions"
        (click)="presenter.resetCommand.execute()"
      />
      <div class="flex-1"></div>
      <mosaik-button
        test-id="cancel-settings-editor"
        [label]="tr('loc.symphony.cancel.19766e')"
        [appearance]="'plain'"
        (click)="presenter.closeCommand.execute()"
      />
      <mosaik-button
        [attr.test-id]="'builtin-skill-save-' + presenter.data.role"
        [label]="tr('loc.symphony.save.1509f5')"
        [appearance]="'solid'"
        [variant]="'primary'"
        [isBusy]="presenter.busy()"
        [disabled]="presenter.busy()"
        (click)="presenter.saveCommand.execute()"
      />
    </div>
  </ng-template>
</ng-container>
