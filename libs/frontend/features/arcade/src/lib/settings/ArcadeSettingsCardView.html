<symphony-settings-group
  test-id="arcade-settings-card"
  [heading]="'Navigation'"
  [description]="'Choose which optional destinations appear in Symphony.'"
>
  <symphony-settings-row
    [label]="'Show Arcade'"
    [description]="'Add all ' + presenter.arcadeGameCount + ' bundled games to the main navigation.'"
  >
    <symphony-arcade-enabled-toggle />
  </symphony-settings-row>
  @if (presenter.arcadeEnabled()) {
  <symphony-settings-row
    test-id="arcade-god-mode"
    [label]="'God mode'"
    [description]="presenter.arcadeGodModeEnabled() ? 'God mode is active for this session.' : 'Press the keys in order. Progress resets after two seconds without a key.'"
  >
    <div
      test-id="arcade-god-mode-sequence"
      class="flex flex-wrap items-center justify-end gap-[6px]"
      role="group"
      aria-label="God mode key sequence"
    >
      @for (key of presenter.arcadeGodModeSequence; track $index) {
      <mosaik-kbd
        [attr.test-id]="'arcade-god-mode-key-' + $index"
        [value]="[key]"
        [variant]="$index < presenter.arcadeGodModeProgress() ? 'success' : 'default'"
      />
      }
    </div>
  </symphony-settings-row>
  }
</symphony-settings-group>
