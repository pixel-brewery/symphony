<ng-container *mosaikTranslate="let tr">
  <mosaik-toggle-switch
    test-id="arcade-enabled-toggle"
    [variant]="'primary'"
    [isChecked]="presenter.enabled.value()"
    [attr.aria-label]="tr('loc.symphony.show.arcade.b48bb7')"
    (checked)="presenter.setEnabledCommand.execute(true)"
    (unchecked)="presenter.setEnabledCommand.execute(false)"
  />
</ng-container>
