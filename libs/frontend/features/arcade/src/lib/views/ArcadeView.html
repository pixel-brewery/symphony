<mosaik-page
  class="flex h-full min-h-0 w-full min-w-0 flex-1 flex-col overflow-hidden"
  test-id="arcade-view"
>
  <mosaik-page-header
    [text]="'Arcade'"
    [subText]="'Choose a game.'"
    [inset]="'all'"
    test-id="arcade-header"
  />
  <mosaik-page-content
    class="flex min-h-0 flex-1 flex-col overflow-auto"
    [inset]="'all'"
    test-id="arcade-gallery"
  >
    <div
      class="m-auto flex w-fit max-w-full flex-wrap items-center justify-center gap-6"
      test-id="arcade-tiles"
    >
      <div
        class="aspect-[120/155] w-[calc(240px*120/155)] max-w-full shrink-0"
        test-id="arcade-game-pitfall"
      >
        <mosaik-tile
          test-id="arcade-play-pitfall"
          [type]="'button'"
          [fit]="'both'"
          [appearance]="'plain'"
          [variant]="'neutral'"
          [elevation]="'none'"
          [command]="{ click: presenter.playPitfallCommand }"
        >
          <mosaik-image
            class="absolute inset-0"
            test-id="arcade-cover-pitfall"
            [src]="'arcade/pitfall.webp'"
            [alt]="''"
            [width]="'100%'"
            [height]="'100%'"
            [fit]="'contain'"
            [showFailed]="true"
            [variant]="'neutral'"
          />
          <span class="sr-only">Play Pitfall!</span>
        </mosaik-tile>
      </div>
      <div
        class="aspect-[120/155] w-[calc(240px*120/155)] max-w-full shrink-0"
        test-id="arcade-game-pitfall-ii"
      >
        <mosaik-tile
          test-id="arcade-play-pitfall-ii"
          [type]="'button'"
          [fit]="'both'"
          [appearance]="'plain'"
          [variant]="'neutral'"
          [elevation]="'none'"
          [command]="{ click: presenter.playPitfallIICommand }"
        >
          <mosaik-image
            class="absolute inset-0"
            test-id="arcade-cover-pitfall-ii"
            [src]="'arcade/pitfall-ii.webp'"
            [alt]="''"
            [width]="'100%'"
            [height]="'100%'"
            [fit]="'contain'"
            [showFailed]="true"
            [variant]="'neutral'"
          />
          <span class="sr-only">Play Pitfall II: Lost Caverns</span>
        </mosaik-tile>
      </div>
      <div
        class="aspect-[120/155] w-[calc(240px*120/155)] max-w-full shrink-0"
        test-id="arcade-game-breakout"
      >
        <mosaik-tile
          test-id="arcade-play-breakout"
          [type]="'button'"
          [fit]="'both'"
          [appearance]="'plain'"
          [variant]="'neutral'"
          [elevation]="'none'"
          [command]="{ click: presenter.playBreakoutCommand }"
        >
          <mosaik-image
            class="absolute inset-0"
            test-id="arcade-cover-breakout"
            [src]="'arcade/breakout.webp'"
            [alt]="''"
            [width]="'100%'"
            [height]="'100%'"
            [fit]="'contain'"
            [showFailed]="true"
            [variant]="'neutral'"
          />
          <span class="sr-only">Play Breakout</span>
        </mosaik-tile>
      </div>
      <div
        class="aspect-[120/155] w-[calc(240px*120/155)] max-w-full shrink-0"
        test-id="arcade-game-realsports-boxing"
      >
        <mosaik-tile
          test-id="arcade-play-realsports-boxing"
          [type]="'button'"
          [fit]="'both'"
          [appearance]="'plain'"
          [variant]="'neutral'"
          [elevation]="'none'"
          [command]="{ click: presenter.playRealSportsBoxingCommand }"
        >
          <mosaik-image
            class="absolute inset-0"
            test-id="arcade-cover-realsports-boxing"
            [src]="'arcade/realsports-boxing.webp'"
            [alt]="''"
            [width]="'100%'"
            [height]="'100%'"
            [fit]="'contain'"
            [showFailed]="true"
            [variant]="'neutral'"
          />
          <span class="sr-only">Play RealSports Boxing</span>
        </mosaik-tile>
      </div>
      <div
        class="aspect-[120/155] w-[calc(240px*120/155)] max-w-full shrink-0"
        test-id="arcade-game-jungle-hunt"
      >
        <mosaik-tile
          test-id="arcade-play-jungle-hunt"
          [type]="'button'"
          [fit]="'both'"
          [appearance]="'plain'"
          [variant]="'neutral'"
          [elevation]="'none'"
          [command]="{ click: presenter.playJungleHuntCommand }"
        >
          <mosaik-image
            class="absolute inset-0"
            test-id="arcade-cover-jungle-hunt"
            [src]="'arcade/jungle-hunt.webp'"
            [alt]="''"
            [width]="'100%'"
            [height]="'100%'"
            [fit]="'contain'"
            [showFailed]="true"
            [variant]="'neutral'"
          />
          <span class="sr-only">Play Jungle Hunt</span>
        </mosaik-tile>
      </div>
      <div
        class="aspect-[120/155] w-[calc(240px*120/155)] max-w-full shrink-0"
        test-id="arcade-game-pong"
      >
        <mosaik-tile
          test-id="arcade-play-pong"
          [type]="'button'"
          [fit]="'both'"
          [appearance]="'plain'"
          [variant]="'neutral'"
          [elevation]="'none'"
          [command]="{ click: presenter.playPongCommand }"
        >
          <mosaik-image
            class="absolute inset-0"
            test-id="arcade-cover-pong"
            [src]="'arcade/pong.webp'"
            [alt]="''"
            [width]="'100%'"
            [height]="'100%'"
            [fit]="'contain'"
            [showFailed]="true"
            [variant]="'neutral'"
          />
          <span class="sr-only">Play Pong</span>
        </mosaik-tile>
      </div>
      <div
        class="aspect-[120/155] w-[calc(240px*120/155)] max-w-full shrink-0"
        test-id="arcade-game-seaquest"
      >
        <mosaik-tile
          test-id="arcade-play-seaquest"
          [type]="'button'"
          [fit]="'both'"
          [appearance]="'plain'"
          [variant]="'neutral'"
          [elevation]="'none'"
          [command]="{ click: presenter.playSeaquestCommand }"
        >
          <mosaik-image
            class="absolute inset-0"
            test-id="arcade-cover-seaquest"
            [src]="'arcade/seaquest.webp'"
            [alt]="''"
            [width]="'100%'"
            [height]="'100%'"
            [fit]="'contain'"
            [showFailed]="true"
            [variant]="'neutral'"
          />
          <span class="sr-only">Play Seaquest</span>
        </mosaik-tile>
      </div>
      <div
        class="aspect-[120/155] w-[calc(240px*120/155)] max-w-full shrink-0"
        test-id="arcade-game-river-raid"
      >
        <mosaik-tile
          test-id="arcade-play-river-raid"
          [type]="'button'"
          [fit]="'both'"
          [appearance]="'plain'"
          [variant]="'neutral'"
          [elevation]="'none'"
          [command]="{ click: presenter.playRiverRaidCommand }"
        >
          <mosaik-image
            class="absolute inset-0"
            test-id="arcade-cover-river-raid"
            [src]="'arcade/river-raid.webp'"
            [alt]="''"
            [width]="'100%'"
            [height]="'100%'"
            [fit]="'contain'"
            [showFailed]="true"
            [variant]="'neutral'"
          />
          <span class="sr-only">Play River Raid</span>
        </mosaik-tile>
      </div>
      <div
        class="aspect-[120/155] w-[calc(240px*120/155)] max-w-full shrink-0"
        test-id="arcade-leaderboard"
      >
        <mosaik-tile
          test-id="arcade-open-leaderboard"
          [type]="'button'"
          [fit]="'both'"
          [appearance]="'outline'"
          [variant]="'neutral'"
          [elevation]="'none'"
          [command]="{ click: presenter.showLeaderboardCommand }"
        >
          <div class="flex h-full w-full flex-col items-center justify-center gap-3 p-4">
            <mosaik-icon aria-hidden="true" [icon]="'leaderboard'" [size]="'large'" />
            <span [mosaikTypography]="'headline5'">Leaderboard</span>
            <mosaik-text
              [text]="
                presenter.leaderboardEntries().length === 1
                  ? '1 saved result'
                  : presenter.leaderboardEntries().length + ' saved results'
              "
              [mosaikTypography]="'caption'"
              [wrap]="true"
            />
          </div>
        </mosaik-tile>
      </div>
    </div>
  </mosaik-page-content>
</mosaik-page>
