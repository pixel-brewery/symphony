<ng-container *mosaikTranslate="let tr">
  <div
    class="flex w-max max-w-full items-center gap-2"
    role="toolbar"
    [attr.aria-label]="ariaLabel()"
  >
    <mosaik-toolbar
      class="empty:hidden"
      part="primary-actions"
      test-id="page-toolbar-primary-actions"
      role="group"
      [attr.aria-label]="tr('loc.symphony.primary.actions.2941bf')"
      [appearance]="'plain'"
    >
      <ng-content select="[slot=start]" />
    </mosaik-toolbar>
    <mosaik-toolbar
      class="empty:hidden"
      part="secondary-actions"
      test-id="page-toolbar-secondary-actions"
      role="group"
      [attr.aria-label]="tr('loc.symphony.secondary.actions.731175')"
      [appearance]="'plain'"
    >
      <ng-content select="[slot=end]" />
    </mosaik-toolbar>
  </div>
</ng-container>
