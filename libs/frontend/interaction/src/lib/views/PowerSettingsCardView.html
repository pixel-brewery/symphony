<symphony-settings-group
  test-id="keep-awake-settings-group"
  [level]="'section'"
  [heading]="'Sleep'"
  [description]="'Symphony holds sleep only while a task runs and releases it when the last one finishes. Closing the lid still sleeps.'"
>
  <symphony-settings-row
    [label]="'Keep this Mac awake while tasks run'"
    [description]="'The display may still turn off, and battery use rises while a task runs.'"
  >
    <symphony-keep-awake-toggle />
  </symphony-settings-row>
  @if (presenter.power.state(); as power) {
  <symphony-settings-row
    test-id="keep-awake-status"
    [label]="power | keepAwakeStatusLabel"
    [description]="power | keepAwakeDetails"
  >
    <mosaik-dot
      slot="leading"
      aria-hidden="true"
      [variant]="power.engaged ? 'success' : 'neutral'"
      [size]="'small'"
    />
  </symphony-settings-row>
  } @else {
  <symphony-settings-row
    test-id="keep-awake-status-loading"
    role="status"
    aria-label="Loading sleep status"
    [label]="'Sleep status'"
  >
    <mosaik-skeleton slot="detail" [width]="'20rem'" [height]="'12px'" [shimmer]="true" />
  </symphony-settings-row>
  }
</symphony-settings-group>
