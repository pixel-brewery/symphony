<ng-container *mosaikTranslate="let tr">
  <symphony-settings-group
    test-id="keep-awake-settings-group"
    [level]="'section'"
    [heading]="tr('loc.symphony.sleep.d466bc')"
    [description]="tr('loc.symphony.symphony.holds.sleep.only.while.a.task.runs.and.rele.c463c9')"
  >
    <symphony-settings-row
      [label]="tr('loc.symphony.keep.this.mac.awake.while.tasks.run.b2457a')"
      [description]="tr('loc.symphony.the.display.may.still.turn.off.and.battery.use.rises.9081cc')"
    >
      <symphony-keep-awake-toggle />
    </symphony-settings-row>
    @if (presenter.power.state(); as power) {
    <symphony-settings-row
      test-id="keep-awake-status"
      [label]="power | keepAwakeStatusLabel"
      [description]="power | keepAwakeDetails"
    >
      <mosaik-dot
        slot="leading"
        aria-hidden="true"
        [variant]="power.engaged ? 'success' : 'neutral'"
        [size]="'small'"
      />
    </symphony-settings-row>
    } @else {
    <symphony-settings-row
      test-id="keep-awake-status-loading"
      role="status"
      [attr.aria-label]="tr('loc.symphony.loading.sleep.status.85d24e')"
      [label]="tr('loc.symphony.sleep.status.4ad5a2')"
    >
      <mosaik-skeleton slot="detail" [width]="'20rem'" [height]="'12px'" [shimmer]="true" />
    </symphony-settings-row>
    }
  </symphony-settings-group>
</ng-container>
