<symphony-settings-group
  test-id="update-settings-card"
  [level]="'section'"
  [heading]="'Updates'"
  [description]="'The release channel decides which versions Symphony offers; download and restart happen from the status bar of the main window.'"
>
  <symphony-settings-row
    test-id="update-status"
    [label]="presenter.updates.state() | updateStatusLabel"
    [description]="presenter.updates.state() | updateDetails"
  >
    <mosaik-button
      test-id="check-for-updates"
      [label]="'Check for updates'"
      [appearance]="'outline'"
      [disabled]="!presenter.canCheckForUpdates()()"
      [isBusy]="presenter.updates.busy() || presenter.updates.state()?.kind === 'checking'"
      (click)="presenter.updates.check()"
    />
  </symphony-settings-row>
  <symphony-settings-row
    test-id="update-channel-guide"
    [label]="'Release channel'"
    [description]="'Stable receives tested releases. Canary receives every successful main build and may change more frequently.'"
  >
    <mosaik-select
      test-id="update-channel"
      class="w-[186px]"
      [value]="presenter.updates.state()?.channel ?? 'stable'"
      [disabled]="presenter.updates.state()?.kind === 'downloading' || presenter.updates.state()?.kind === 'checking'"
      [attr.aria-label]="'Release channel'"
      (selectionChanged)="presenter.updateChannelCommand.execute($event)"
    >
      <mosaik-select-item
        test-id="update-channel-stable"
        [label]="'Stable'"
        [value]="'stable'"
        (click)="presenter.updateChannelCommand.execute('stable')"
      />
      <mosaik-select-item
        test-id="update-channel-canary"
        [label]="'Canary - every successful main build'"
        [value]="'canary'"
        (click)="presenter.updateChannelCommand.execute('canary')"
      />
    </mosaik-select>
  </symphony-settings-row>
</symphony-settings-group>
